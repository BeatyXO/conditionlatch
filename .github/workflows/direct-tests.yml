name: Direct Mode

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  direct-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned test tooling
        run: python -m pip install -r requirements-test.txt
      - name: Repository preflight
        run: python scripts/preflight.py
      - name: Compile Python
        run: python -m compileall -q contracts tests scripts
      - name: Direct Mode tests
        run: pytest tests/direct -q
